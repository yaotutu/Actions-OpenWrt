# Standalone repository: do not sync from the historical template upstream.
name: Update Checker

env:
  REPO_URL: https://git.openwrt.org/openwrt/openwrt.git
  REPO_BRANCH: master

on:
  workflow_dispatch:
  schedule:
    - cron: 0 16 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    - name: Get Latest Supported Tag
      id: getTag
      run: |
        git clone --branch $REPO_BRANCH $REPO_URL .
        # PassWall binary feeds currently support the OpenWrt 24.10 series.
        latest_tag=$(git tag --list 'v24.10.*' | sort -V | tail -n1)
        [ -n "$latest_tag" ] || { echo "No OpenWrt 24.10 tag found"; exit 1; }
        echo "latestTag=$latest_tag" >> $GITHUB_OUTPUT

    - name: Compare Tag
      id: cacheTag
      uses: actions/cache@main
      with:
        path: .latestTag
        key: OpenWrt-${{ steps.getTag.outputs.latestTag }}

    - name: Save New Tag
      if: steps.cacheTag.outputs.cache-hit != 'true'
      run: |
        echo ${{ steps.getTag.outputs.latestTag }} | tee .latestTag

    - name: Trigger build
      if: steps.cacheTag.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@main
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        event-type: Source Code Update
        client-payload: '{"version": "stable"}'

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 1
